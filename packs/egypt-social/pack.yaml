# Egypt national curriculum, Social Studies, Primary 4 to Preparatory 2 (grades 4 to 8). DRAFT.
#
# What is taken from the curriculum: the topics, their grade and their term, as listed in the unit and
# lesson titles of the student books (history, geography and civics are taught as one subject).
# Titles are shortened into plain topic names in our own words. No textbook text is copied.
# Where two neighbouring lessons of one unit cover one topic, they are merged into one topic here.
# Each topic names its source below. Primary 4 (both terms), Primary 5 term 1 and Primary 6 term 1 were
# read from scanned copies of the ministry student books. The other six terms were read from commercial
# workbooks and teacher notes that follow the ministry books, which are secondary sources. None of the
# sources is the ministry's own website, so check a topic against the current printed book before relying
# on it. A source was found for every grade and term, so no topic is marked `verified: false`. The titles
# were read from machine-read scans of Arabic text and translated by the authors of this software.
#
# What is NOT from the curriculum: the `requires` links and the grouping into strands. The curriculum does
# not publish which topic depends on which. In this subject the links are mostly about background and
# skills (reading a map before climate regions, an earlier period before a later one, the same theme met
# at a smaller scale in an earlier grade). These links were drafted by the authors of this software and
# have not yet been reviewed by a teacher. The trace-back is only as good as these links.
#
# We graph the school's curriculum. We never change it.
