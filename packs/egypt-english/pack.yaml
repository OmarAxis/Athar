# Egypt national curriculum, English as a foreign language, Primary 4 to Preparatory 2 (grades 4 to 8). DRAFT.
#
# What is taken from the curriculum: the topics, their grade and their term, as listed in the scope and
# sequence pages and unit overviews of the student books (the Connect series in Primary 4 to 6, and the
# ministry's own preparatory books, copyright 2025, in Preparatory 1 and 2). English courses are built on
# skills, so a topic here is one teachable point of a unit: a grammar point, a reading or listening skill,
# a writing task type, a vocabulary field or a phonics point. Topics are shortened into plain names and a
# few neighbouring points of a term are merged into one topic. No textbook text is copied.
# Each topic names its source below. None of the sources is the ministry's own website (it refused our
# requests), so check a topic against the current printed book before relying on it. Weaker spots:
#   - Primary 4 term 2 was read from a 2021/22 printing, and the scan is hard to read in places.
#   - Primary 5 term 2 and Primary 6 term 2 were read from commercial workbooks that follow the ministry book.
#   - Preparatory 1 term 2: the unit titles come from a news article, and the language points were worked out
#     from the exercises of an assessment booklet, not from a scope and sequence page.
#   - Preparatory 1 used a different book (Hello! Beyond Words) in 2024/25. This map follows the newer
#     ministry book that replaced it.
# A topic marked `verified: false` would be one that was not read from any source. This file has none.
#
# What is NOT from the curriculum: the `requires` links and the grouping into strands. The curriculum does
# not publish which topic depends on which. These links were drafted by the authors of this software and
# have not yet been reviewed by a teacher. The trace-back is only as good as these links.
#
# We graph the school's curriculum. We never change it.
